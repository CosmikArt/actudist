[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "actudist"
version = "0.0.1"
description = "Actuarial probability distributions — heavy tails, MLE fitting, and goodness-of-fit testing."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Isaac López", email = "isaaclopg@gmail.com" },
]
keywords = [
    "actuarial",
    "insurance",
    "distributions",
    "severity",
    "frequency",
    "MLE",
    "goodness-of-fit",
    "heavy-tail",
    "Burr",
    "Pareto",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/CosmikArt/actudist"
Repository = "https://github.com/CosmikArt/actudist"
Issues = "https://github.com/CosmikArt/actudist/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/actudist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
